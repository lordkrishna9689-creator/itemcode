
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast & Sorted PDF Item Code Extractor</title>

    <!-- PDF.js Library for reading PDFs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- SheetJS (XLSX) Library for exporting to Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f4f6f9;
            color: #333;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            margin-top: 0;
            color: #2c3e50;
        }
        .upload-section {
            border: 2px dashed #3498db;
            padding: 30px;
            text-align: center;
            border-radius: 6px;
            background: #ebf5fb;
            margin-bottom: 20px;
            transition: background 0.3s;
            cursor: pointer;
        }
        .upload-section.dragover {
            background-color: #d4e6f1;
        }
        input[type="file"] {
            display: none;
        }
        .custom-file-upload {
            display: inline-block;
            padding: 10px 20px;
            cursor: pointer;
            background-color: #3498db;
            color: white;
            border-radius: 4px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .custom-file-upload:hover {
            background-color: #2980b9;
        }
        .actions {
            margin-bottom: 20px;
        }
        button {
            padding: 10px 18px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #27ae60;
        }
        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
        .progress-bar-container {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 4px;
            margin-bottom: 15px;
            display: none;
        }
        .progress-bar {
            width: 0%;
            height: 12px;
            background-color: #2ecc71;
            border-radius: 4px;
            transition: width 0.1s;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
            color: #2c3e50;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>PDF Item Code Extractor</h2>
    <p>Drag & drop folders below to extract Item Codes sorted from <b>Small to Large</b>.</p>

    <div class="upload-section" id="drop-zone">
        <label for="pdf-input" class="custom-file-upload">
            Select PDF Files / Folders
        </label>
        <input type="file" id="pdf-input" multiple webkitdirectory accept="application/pdf">
        <p id="file-count" style="margin-top: 15px; color: #555;">Drag and drop folders or click above</p>
    </div>

    <div class="progress-bar-container" id="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div class="actions">
        <button id="export-btn" onclick="exportToExcel()" disabled>Export to Excel</button>
    </div>

    <table id="result-table">
        <thead>
            <tr>
                <th>File Name</th>
                <th>Item Code</th>
            </tr>
        </thead>
        <tbody id="table-body">
            <tr>
                <td colspan="2" style="text-align: center; color: #888;">Drag and drop folders to process PDFs.</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    // Set PDF worker URL
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let extractedData = [];
    const dropZone = document.getElementById('drop-zone');

    // Drag-and-drop events
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));

    dropZone.addEventListener('drop', async (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');

        const items = e.dataTransfer.items;
        if (!items) return;

        let pdfFiles = [];
        for (let i = 0; i < items.length; i++) {
            const entry = items[i].webkitGetAsEntry ? items[i].webkitGetAsEntry() : null;
            if (entry) await scanFiles(entry, pdfFiles);
        }

        if (pdfFiles.length > 0) processPDFFilesSuperFast(pdfFiles);
    });

    document.getElementById('pdf-input').addEventListener('change', function(e) {
        const files = Array.from(e.target.files).filter(f => f.name.toLowerCase().endsWith('.pdf'));
        if (files.length > 0) processPDFFilesSuperFast(files);
    });

    // Recursively traverse dropped folders
    async function scanFiles(entry, pdfFiles) {
        if (entry.isFile) {
            if (entry.name.toLowerCase().endsWith('.pdf')) {
                pdfFiles.push(await new Promise((r) => entry.file(r)));
            }
        } else if (entry.isDirectory) {
            const dirReader = entry.createReader();
            const entries = await new Promise((r) => dirReader.readEntries(r));
            for (let child of entries) {
                await scanFiles(child, pdfFiles);
            }
        }
    }

    // Processing PDFs in high-speed parallel batches
    async function processPDFFilesSuperFast(files) {
        const startTime = performance.now();
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const fileCountText = document.getElementById('file-count');
        const tableBody = document.getElementById('table-body');

        progressContainer.style.display = 'block';
        progressBar.style.width = '0%';
        fileCountText.innerText = `Processing ${files.length} PDFs...`;
        tableBody.innerHTML = '<tr><td colspan="2" style="text-align:center;">Extracting and sorting data... please wait.</td></tr>';
        
        extractedData = [];

        const CHUNK_SIZE = 20; // Parallel batch size
        let completed = 0;

        for (let i = 0; i < files.length; i += CHUNK_SIZE) {
            const chunk = files.slice(i, i + CHUNK_SIZE);
            const chunkResults = await Promise.all(chunk.map(file => processSinglePDF(file)));
            
            extractedData.push(...chunkResults);
            completed += chunk.length;

            const percent = Math.min(100, Math.round((completed / files.length) * 100));
            progressBar.style.width = `${percent}%`;
        }

        // --- NUMERICAL SORT (SMALL TO LARGE) ---
        extractedData.sort((a, b) => {
            const numA = parseInt(a.itemCode, 10);
            const numB = parseInt(b.itemCode, 10);

            if (!isNaN(numA) && !isNaN(numB)) {
                return numA - numB;
            }
            return a.itemCode.localeCompare(b.itemCode, undefined, { numeric: true, sensitivity: 'base' });
        });

        // Render table once sorting is done
        renderTableRows(extractedData);

        const timeTaken = ((performance.now() - startTime) / 1000).toFixed(2);
        fileCountText.innerText = `Done! Processed & sorted ${files.length} PDFs in ${timeTaken} seconds.`;
        document.getElementById('export-btn').disabled = false;
    }

    // Extract text from page 1 of each PDF
    async function processSinglePDF(file) {
        try {
            const arrayBuffer = await file.arrayBuffer();
            const pdfTask = pdfjsLib.getDocument({ data: arrayBuffer, stopAtErrors: true });
            const pdf = await pdfTask.promise;
            
            const page = await pdf.getPage(1);
            const textContent = await page.getTextContent();
            
            let fullText = '';
            for (let i = 0; i < textContent.items.length; i++) {
                fullText += textContent.items[i].str + ' ';
            }

            // Strictly extract the value immediately following "Item Code:"
            const match = fullText.match(/Item\s*Code\s*:\s*([^\s]+)/i);
            const itemCode = match ? match[1].trim() : 'Not Found';

            pdf.cleanup();
            pdf.destroy();

            return { fileName: file.name, itemCode: itemCode };
        } catch (e) {
            return { fileName: file.name, itemCode: 'Error' };
        }
    }

    // Render table DOM
    function renderTableRows(data) {
        const tableBody = document.getElementById('table-body');
        let htmlStr = '';
        
        // Render preview limit for UI performance
        const displayData = data.slice(0, 300);

        for (let row of displayData) {
            htmlStr += `<tr><td>${row.fileName}</td><td><strong>${row.itemCode}</strong></td></tr>`;
        }

        if (data.length > 300) {
            htmlStr += `<tr><td colspan="2" style="text-align:center; color:#e67e22;"><em>+ ${data.length - 300} more items hidden from preview (all will be exported to Excel).</em></td></tr>`;
        }

        tableBody.innerHTML = htmlStr;
    }

    // Export sorted results to XLSX
    function exportToExcel() {
        if (!extractedData.length) return;

        const excelData = extractedData.map(item => ({
            "File Name": item.fileName,
            "Item Code": item.itemCode
        }));

        const worksheet = XLSX.utils.json_to_sheet(excelData);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Item Codes");

        XLSX.writeFile(workbook, "Sorted_Item_Codes.xlsx");
    }
</script>

</body>
</html>
